spring.application.name=backend

# MySQL XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/db_smart_class
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true

# Server
server.port=8081
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# JWT: override JWT_KEY in the environment for production.
jwt.secret-key=${JWT_KEY:SmartClassLocalDevJwtSecretKey32b}
jwt.expiration-time-access-token=600

# JWT REFRESH TOKEN
jwt.secret=cnI3ZnHdaV+rSrqjKxK3kfbYbm5J8qBYrv3KqAbNd1Q=
jwt.access-expiration-ms=900000
